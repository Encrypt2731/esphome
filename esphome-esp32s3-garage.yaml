# ============================================================
# ESPHome – ESP32-S3 (Seeed XIAO) WiFi Garage Door Controller
# File: esphome-esp32s3-garage.yaml
# ============================================================
#
# Hardware
# --------
# Board : Seeed XIAO ESP32-S3 (WiFi + Bluetooth; no Zigbee/Thread)
# Relay : 5 V or 3.3 V NO (Normally Open) single-channel module,
#         active-HIGH (coil energises when IN pin is HIGH)
# Sensor: Reed / magnetic contact switch, NO type
#
# Default pin assignments — adjust these to match your wiring:
#   GPIO4  (D3) → Relay IN  (relay coil control, active-HIGH)
#   GPIO2  (D1) → Sensor    (reed switch: one leg to GPIO, other to GND)
#
# ── Wiring ────────────────────────────────────────────────────
#
#  Power the relay module from 5V or 3V3 depending on your module's
#  rating. The XIAO ESP32-S3 exposes both rails on its power header.
#  The reed switch only needs GPIO + GND — no external power.
#
#  XIAO ESP32-S3            (Seeed XIAO ESP32S3 label)
#  ┌─────────────┐
#  │        3V3 ├──────────── VCC (relay — if 3.3 V rated)
#  │         5V ├──────────── VCC (relay — if 5 V rated)
#  │        GND ├──────────── GND (relay)
#  │        GND ├──────────── GND (reed switch, one leg)
#  │      GPIO4 ├──────────►  IN  (relay coil control)   (D3)
#  │      GPIO2 ├◄──────────  COM (reed switch, other leg) (D1)
#  └─────────────┘
#
# WiFi + Home Assistant connectivity
# ------------------------------------
# 1. Flash this firmware to the XIAO ESP32-S3 (USB-C).
# 2. The device connects to WiFi using secrets.yaml credentials.
# 3. Home Assistant discovers it automatically via mDNS once both
#    are on the same network.
# 4. All future reflashes can be done over the air (OTA).
#
# Safety design for the relay
# ----------------------------
# The relay is wired to the garage opener's dry-contact terminals.
# The ONLY way the relay coil can ever be energised is via an explicit
# Home Assistant "turn on" command, and even then only for 300 ms.
# Three independent layers enforce this:
#   1. output.restore_value: false  — GPIO pin is always LOW on boot
#   2. switch.restore_mode: ALWAYS_OFF — switch state is never stored
#   3. on_boot automation — relay opens again before components start
# ============================================================

esphome:
  name: garage-door
  friendly_name: Garage Door Controller
  # Belt-and-suspenders: explicitly de-energise the relay before any
  # other component is initialised, in case of GPIO float during startup.
  on_boot:
    priority: 600          # Runs early — before most components start
    then:
      - output.turn_off: relay_output


# ──────────────────────────────────────────
#  Hardware target
#
#  Seeed XIAO ESP32-S3: WiFi + Bluetooth, no Zigbee or Thread.
#  The Arduino framework is used here for broad component support.
#  board: seeed_xiao_esp32s3 sets the correct flash size, USB-Serial
#  JTAG peripheral, and pin definitions for this specific module.
# ──────────────────────────────────────────
esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: arduino


# ──────────────────────────────────────────
#  Serial logging
#
#  The XIAO ESP32-S3's USB-C port uses the USB Serial JTAG peripheral,
#  not a traditional UART. Without hardware_uart: USB_SERIAL_JTAG, log
#  output is sent to GPIO43/44 (UART0) and nothing appears over USB-C.
# ──────────────────────────────────────────
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG


# ── WiFi & Home Assistant API ─────────────────────────────────────────────────
#
#  wifi: connects to your home network using credentials from secrets.yaml.
#
#  wifi.ap: if the primary WiFi connection fails (wrong password, router
#    rebooted, etc.), the device falls back to broadcasting its own access
#    point named "garage-door". Connect to it to reach the captive portal.
#
#  captive_portal: when connected to the fallback AP, a web page lets you
#    update WiFi credentials without needing a USB cable or reflash.
#
#  api: the ESPHome native protocol that Home Assistant uses to communicate
#    with the device. The encryption key prevents network sniffing; HA
#    discovers the device automatically via mDNS once it is on the same network.
#
#  ota: allows reflashing the firmware over WiFi from the ESPHome dashboard
#    or CLI. After the first USB flash, all future updates can be wireless.
# ─────────────────────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 15dB
  power_save_mode: NONE
  reboot_timeout: 0min

#   ap:
#     ssid: "garage-door"
#     password: !secret fallback_ap_password

# captive_portal:

api:
  encryption:
    key: !secret garage_door_controller__encryption_key
ota:
  - platform: esphome
    password: !secret ota_password


# ============================================================
# OUTPUT — Raw GPIO pin that drives the relay coil
# ============================================================
# Using a low-level 'output' component (rather than a switch directly)
# gives us the most direct, unambiguous control over the GPIO pin.
#
# restore_value: false  ← critical safety setting.
#   The pin is always initialised LOW on every boot.  The previous
#   on/off state is deliberately never saved or restored.
output:
  - platform: gpio
    id: relay_output
    pin:
      number: GPIO4        # ← CHANGE: relay IN pin on your board  (XIAO: D3)
      mode:
        output: true       # Standard push-pull output (not open-drain)
    restore_value: false   # GPIO always starts LOW; relay always starts open


# ============================================================
# SWITCH — Momentary trigger exposed to Home Assistant via WiFi
# ============================================================
# Home Assistant discovers this as a standard on/off switch.
# When HA issues a "turn on" command the sequence is:
#   1. relay_output goes HIGH  → relay coil energises → contacts close
#   2. The 'on_turn_on' automation waits exactly 300 ms
#   3. switch.turn_off fires   → GPIO goes LOW → relay opens
#   4. HA entity resets to OFF
#
# Because the switch self-resets to OFF, Home Assistant cannot
# hold the relay closed by maintaining a persistent "on" command.
switch:
  - platform: output
    name: "Garage Door Trigger"
    id: relay_switch
    output: relay_output
    # ALWAYS_OFF: ESPHome will never restore a previous ON state from
    # flash/NVS.  The relay is guaranteed open on every cold start.
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - delay: 300ms                    # Hard-coded 300 ms contact closure
        - switch.turn_off: relay_switch   # Open relay + reset HA state to OFF


# ============================================================
# BINARY SENSOR — Magnetic door contact (reed switch)
# ============================================================
# Typical wiring for a NO (Normally Open) reed switch:
#   • Door CLOSED: magnet present  → reed contacts close → GPIO pulled LOW
#                  → inverted: true → ESPHome/HA reports "Closed"
#   • Door OPEN:   magnet absent   → reed contacts open  → GPIO floats HIGH
#                  via internal pull-up resistor
#                  → inverted: true → ESPHome/HA reports "Open"
#
# If your specific sensor behaves the opposite way (e.g. NC type),
# remove the 'inverted: true' line — no other change needed.
binary_sensor:
  - platform: gpio
    name: "Garage Door"
    id: door_sensor
    pin:
      number: GPIO2        # ← CHANGE: sensor input pin on your board  (XIAO: D1)
      mode:
        input: true
        pullup: true       # Use the chip's built-in pull-up; no external
                           # resistor is required
      inverted: true       # Closed circuit (door closed) → reports Closed
    # 'garage_door' device class tells Home Assistant to display proper
    # open/closed icons and use the correct state text.
    device_class: garage_door
    filters:
      # Debounce filter: discard state changes shorter than 50 ms.
      # Prevents false triggers from contact bounce or door vibration.
      - delayed_on_off: 50ms


# ============================================================
# RELAY SAFETY ANALYSIS — Will the relay close on reboot or
# power cycle?
# ============================================================
#
# Short answer: the firmware layers are solid, but there is one
# hardware-level risk worth understanding and mitigating.
#
# --- Software layers (all three hold on reboot) --------------
#
# Layer 1 — output.restore_value: false
#   The GPIO output component initialises the pin LOW as part of
#   its own setup routine, before any other component runs.
#   The previous on/off state is never read from flash/NVS.
#
# Layer 2 — switch.restore_mode: ALWAYS_OFF
#   ESPHome never recalls a saved ON state for this switch.
#   The switch always starts in the OFF (relay open) state.
#
# Layer 3 — on_boot: priority: 600
#   An explicit output.turn_off call runs very early in the boot
#   sequence, after the output pin is configured, as an additional
#   belt-and-suspenders measure.
#
# All three layers operate before WiFi or the HA API initialises,
# so no command can race against them during startup.
# A software (watchdog) reboot is therefore safe.
#
# --- The hardware window (power-on risk) ---------------------
#
# Between the moment power is applied and the moment the firmware
# configures the GPIO as a driven output, there is a window of
# tens of milliseconds where the pin is in its hardware reset state
# and is NOT controlled by firmware.
#
# During this window the pin behaviour is determined by the chip's
# silicon defaults, not by any setting in this file.
#
# GPIO4 on the ESP32-S3 is NOT a strapping pin, so it has no
# internal pull-up that would energise an active-HIGH relay during
# the reset window.  This makes GPIO4 a safe default choice.
#
# For reference, the ESP32-S3 strapping pins are: GPIO0, GPIO3,
# GPIO45, GPIO46.  Avoid these for the relay IN connection.
#
# --- Recommended mitigation ----------------------------------
#
# Add a 10 kΩ pull-down resistor between the relay IN pin and GND.
# This is a HARDWARE guarantee: the relay input is held LOW by
# physics regardless of firmware state or GPIO float.  Even if the
# pin has any residual pull-up tendency, a 10 kΩ external pull-down
# will keep a typical relay optocoupler/transistor firmly off.
#
#    Wiring:
#      XIAO GPIO4 (D3) ──┬──► Relay IN
#                        │
#                      10 kΩ
#                        │
#                       GND
#
# The pull-down makes the relay unconditionally safe during every
# power state, independent of firmware.
# ============================================================
