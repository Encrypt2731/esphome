esphome:
  name: esp32s3-ld2410c
  friendly_name: LD2410C

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: arduino

logger:
  # Disable hardware UART so it does not conflict with LD2410C on GPIO43/44
  baud_rate: 0

api:
  encryption:
    key: !secret esp32s3_ld2410c__encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#   ap:
#     ssid: "ld2410c-fallback"
#     password: !secret fallback_password

# captive_portal:

# LD2410C uses UART at 256000 baud
# D6 (GPIO43) = TX  →  RX pin on LD2410C
# D7 (GPIO44) = RX  →  TX pin on LD2410C
uart:
  id: uart_ld2410
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: ld2410_radar

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target

sensor:
  - platform: ld2410
    moving_distance:
      name: Moving Distance
      unit_of_measurement: cm
    still_distance:
      name: Still Distance
      unit_of_measurement: cm
    moving_energy:
      name: Moving Energy
    still_energy:
      name: Still Energy
    detection_distance:
      name: Detection Distance
      unit_of_measurement: cm
    light:
      name: Illuminance

number:
  - platform: ld2410
    timeout:
      name: Absence Timeout
    max_move_distance_gate:
      name: Max Move Distance Gate
    max_still_distance_gate:
      name: Max Still Distance Gate
    light_threshold:
      name: Light Threshold

select:
  - platform: ld2410
    distance_resolution:
      name: Distance Resolution
    baud_rate:
      name: Baud Rate
    light_function:
      name: Light Function
    out_pin_level:
      name: Out Pin Level

switch:
  - platform: ld2410
    engineering_mode:
      name: Engineering Mode
    bluetooth:
      name: Bluetooth

text_sensor:
  - platform: ld2410
    version:
      name: Firmware Version
    mac_address:
      name: Bluetooth MAC

button:
  - platform: ld2410
    factory_reset:
      name: Factory Reset
    restart:
      name: Restart Sensor
    query_params:
      name: Query Parameters
