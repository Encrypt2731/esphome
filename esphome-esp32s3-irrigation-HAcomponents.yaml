# ═══════════════════════════════════════════════════════════════════════════════
# Home Assistant — Irrigation Schedule & Countdown
#
# Session duration is read from:
#   number.irrigation_controller_session_duration  (set on the ESP32 device)
#
# Session flow:
#   Schedule block starts → script.start_irrigation → turn on → delay → turn off
#   The script owns the full session lifecycle; the timer is display only.
#   The ESP32's 10-minute hard cap remains the final backstop.
#
# Helpers required (Settings → Helpers → Create Helper):
#   timer.irrigation_countdown  (the only helper still needed)
# ═══════════════════════════════════════════════════════════════════════════════


# ── Helper ────────────────────────────────────────────────────────────────────

timer:
  irrigation_countdown:
    name: "Irrigation Countdown"
    icon: mdi:timer-outline
    restore: false


# ── Script ────────────────────────────────────────────────────────────────────
# Single entry point for all HA-triggered sessions (schedule and manual).
# The delay here — not a timer event — is what actually stops the relay.

start_irrigation:
  alias: "Start Irrigation"
  icon: mdi:sprinkler
  mode: single         # Ignore calls while a session is already running
  max_exceeded: silent
  sequence:
    # Skip if already running (e.g. a button-triggered ad hoc cycle is active)
    - condition: state
      entity_id: switch.irrigation_controller_irrigation
      state: "off"
    - service: switch.turn_on
      target:
        entity_id: switch.irrigation_controller_irrigation
    # Hold for the configured duration, then close the relay.
    # Uses number.irrigation_controller_session_duration from the ESP32 device;
    # defaults to 3 minutes if the device is temporarily unavailable.
    - delay:
        seconds: >
          {{ (states('number.irrigation_controller_session_duration') | float(3) * 60) | int }}
    - service: switch.turn_off
      target:
        entity_id: switch.irrigation_controller_irrigation


# ── Automations ───────────────────────────────────────────────────────────────

- alias: "Irrigation: Schedule block started"
  id: irrigation_schedule_start
  description: >
    Calls script.start_irrigation when a scheduled block begins. The script
    manages the full session lifecycle (turn on → delay → turn off), so the
    session length matches number.irrigation_controller_session_duration
    regardless of how long the schedule block is.
  trigger:
    - platform: state
      entity_id: schedule.irrigation_schedule
      to: "on"
  action:
    - service: script.start_irrigation
  mode: single


- alias: "Irrigation: Schedule block ended"
  id: irrigation_schedule_end
  description: >
    Safety net — turns the relay off when the schedule block ends if the relay
    is still on. Covers the case where the block is shorter than the session
    duration or the script did not complete cleanly.
  trigger:
    - platform: state
      entity_id: schedule.irrigation_schedule
      to: "off"
  condition:
    - condition: state
      entity_id: switch.irrigation_controller_irrigation
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.irrigation_controller_irrigation
  mode: single


- alias: "Irrigation: Start countdown"
  id: irrigation_countdown_start
  description: >
    Starts the display timer whenever the relay turns on, regardless of trigger
    source. For display purposes only — session turn-off is managed by the
    script delay (HA sessions) or the ESP32 scripts (button/fallback sessions).
  trigger:
    - platform: state
      entity_id: switch.irrigation_controller_irrigation
      to: "on"
  action:
    - service: timer.start
      target:
        entity_id: timer.irrigation_countdown
      data:
        duration: >
          {{ (states('number.irrigation_controller_session_duration') | float(3) * 60) | int }}
  mode: single


- alias: "Irrigation: Stop countdown"
  id: irrigation_countdown_stop
  description: >
    Cancels the display timer whenever the relay turns off.
  trigger:
    - platform: state
      entity_id: switch.irrigation_controller_irrigation
      to: "off"
  action:
    - service: timer.cancel
      target:
        entity_id: timer.irrigation_countdown
  mode: single
