# ════════════════════════════════════════════════════════════════════════════════
#  ESPHome configuration — ESP32-S3 433MHz Door Chime Bridge (WiFi)
#
#  What this does:
#    1. Listens for the 433MHz RF signal your doorbell button already transmits.
#    2. Reports a "doorbell pressed" event to Home Assistant over WiFi using
#       the ESPHome native API.
#    3. Exposes a button in Home Assistant that, when pressed, transmits the
#       same 433MHz RF code — causing your chime unit to ring on demand.
#
#  Hardware required:
#    - ESP32-S3 development board (e.g. ESP32-S3-DevKitC-1)
#      Note: ESP32-H2 has no WiFi; a WiFi-capable board is required.
#    - SRX882 superheterodyne 433MHz receiver module  (DATA → GPIO4)
#    - STX882 433MHz transmitter module               (DATA → GPIO5)
#    - 17.3cm wire antenna soldered to each module's ANT pad
#
#  Connectivity:
#    Connects to Home Assistant over WiFi using ESPHome's native API.
#    Credentials live in secrets.yaml.
#
#  Setup phases:
#    Phase 1 — Code discovery: uncomment "dump: rc_switch", flash the device,
#              press your doorbell button while watching the serial log, and
#              note the code and protocol values that repeat consistently.
#    Phase 2 — Deployment: fill in your captured code in the two marked places
#              below, re-comment "dump:", and reflash.
# ════════════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────
#  Core device identity
# ──────────────────────────────────────────
esphome:
  name: door-chime-rf
  friendly_name: Door Chime RF Bridge


# ──────────────────────────────────────────
#  Hardware target
#
#  ESP32-S3 — WiFi + Bluetooth, Arduino framework.
#  (ESP32-H2 is Zigbee/Thread/BLE only — no WiFi support.)
# ──────────────────────────────────────────
esp32:
  variant: esp32s3
  framework:
    type: arduino


# ──────────────────────────────────────────
#  Serial logging
#
#  The ESP32-S3's built-in USB port uses the USB Serial JTAG peripheral.
#  Without this setting logs go to GPIO43/44 (UART0) and nothing appears
#  over USB-C.
#  DEBUG level shows every received RF packet — essential during Phase 1.
#  Switch to INFO once codes are confirmed.
# ──────────────────────────────────────────
logger:
  level: DEBUG  # Change to INFO after RF codes are confirmed
  hardware_uart: USB_SERIAL_JTAG


# ── WiFi & Home Assistant API ─────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "door-chime-rf"
    password: !secret wifi_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password


# ──────────────────────────────────────────
#  433MHz Receiver  (SRX882 DATA pin → GPIO4)
#
#  tolerance: how much timing variation is accepted before a pulse is rejected.
#    60% is generous — useful for cheap transmitters.
#  filter: ignores pulses shorter than 250µs, rejecting electrical noise.
#  idle: packet is considered complete if no pulse arrives within 4ms.
#
#  PHASE 1 — Code discovery:
#    Uncomment "dump: rc_switch" below, flash and open the serial log.
#    Press your doorbell button several times. Each press prints a line like:
#      Received RCSwitch Raw: protocol=1 data="010110100101101001011010" (24 bits)
#    The value that repeats consistently is your doorbell code.
#    Re-comment "dump:" before your Phase 2 flash.
# ──────────────────────────────────────────
remote_receiver:
  id: rf_rx
  pin:
    number: GPIO4
    mode:
      input: true
  # dump: rc_switch   # ← Uncomment for Phase 1 code discovery only
  tolerance: 60%
  filter: 250us
  idle: 4ms


# ──────────────────────────────────────────
#  433MHz Transmitter  (STX882 DATA pin ← GPIO5)
#
#  carrier_duty_percent: 100% passes the raw data signal directly. RF modules
#    generate their own carrier internally; no carrier wave baked in here.
# ──────────────────────────────────────────
remote_transmitter:
  id: rf_tx
  pin: GPIO5
  carrier_duty_percent: 100%  # RF modules modulate internally — no carrier needed here


# ──────────────────────────────────────────
#  Doorbell binary sensor
#
#  Watches the remote_receiver for your doorbell button's RF code. When matched,
#  the sensor switches on in Home Assistant for 3 seconds then resets — this
#  debounces the signal (a single press fires 3–10 identical packets) and gives
#  automations a clean trigger edge.
#
#  PHASE 2 — Replace "REPLACE_WITH_CAPTURED_CODE" with your actual code.
# ──────────────────────────────────────────
binary_sensor:
  - platform: remote_receiver
    id: doorbell_button
    name: "Doorbell"
    device_class: occupancy
    rc_switch_raw:
      code: "000000000000000000000000"  # ← REPLACE with your Phase 1 captured code
      protocol: 1                       # ← REPLACE with your Phase 1 protocol number
    filters:
      - delayed_off: 3s


# ──────────────────────────────────────────
#  Ring Chime button
#
#  Pressable from the HA UI or automations. Transmits the doorbell code 3 times
#  with a 10ms gap between bursts — most 433MHz receivers need a few repeats
#  before they act.
#
#  PHASE 2 — Replace "REPLACE_WITH_CAPTURED_CODE" with the same code and
#    protocol used in the binary_sensor section above.
# ──────────────────────────────────────────
button:
  - platform: template
    name: "Ring Chime"
    on_press:
      - repeat:
          count: 3       # Transmit 3 times for reliable delivery
          sequence:
            - remote_transmitter.transmit_rc_switch_raw:
                transmitter_id: rf_tx
                code: "000000000000000000000000"  # ← REPLACE with same code as binary_sensor
                protocol: 1                       # ← REPLACE with same protocol as binary_sensor
            - delay: 10ms  # Brief gap between each repeated burst
