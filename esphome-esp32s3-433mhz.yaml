# ════════════════════════════════════════════════════════════════════════════════
#  ESPHome configuration — ESP32-S3 433MHz Door Chime Bridge (WiFi)
#
#  What this does:
#    1. Listens for the 433MHz RF signal your doorbell button already transmits.
#    2. Reports a "doorbell pressed" event to Home Assistant over WiFi using
#       the ESPHome native API.
#    3. Exposes a button in Home Assistant that, when pressed, transmits the
#       same 433MHz RF code — causing your chime unit to ring on demand.
#
#  ── Wiring ───────────────────────────────────────────────────────────────────
#
#  Power both RF modules from the ESP32-S3's 3V3 pin. The SRX882 runs from
#  2.7V–5.5V; at 3.3V its DATA output is 3.3V logic, directly safe for the
#  ESP32-S3 GPIOs (which are not 5V tolerant). The STX882 runs from 1.8V–3.6V,
#  so 3.3V is at the top of its rated range and needs no level shifting.
#
#  ESP32-S3               (Seeed XIAO ESP32S3 label)
#  ┌─────────────┐
#  │         3V3 ├──────────────── VCC (SRX882)     (3V3 pin)
#  │         3V3 ├──────────────── VCC (STX882)     (3V3 pin)
#  │         GND ├──────────────── GND (SRX882)     (GND pin)
#  │         GND ├──────────────── GND (STX882)     (GND pin)
#  │       GPIO4 ├◄─────────────── DATA (SRX882)    (D3)
#  │       GPIO5 ├──────────────►  DATA (STX882)    (D4)
#  └─────────────┘
#
#  SRX882 (receiver):
#    VCC  — 3V3              (XIAO: 3V3 pin)
#    GND  — GND              (XIAO: GND pin)
#    DATA — GPIO4  (D3)      (some modules have two DATA pins; both carry the
#                             same signal, connect either one)
#    ANT  — 17.3cm solid wire soldered to the ANT pad, held vertical
#
#  STX882 (transmitter):
#    VCC  — 3V3              (XIAO: 3V3 pin)
#    GND  — GND              (XIAO: GND pin)
#    DATA — GPIO5  (D4)
#    ANT  — 17.3cm solid wire soldered to the ANT pad, held vertical
#
#  Antenna:
#    17.3cm is the quarter-wavelength for 433.92MHz (300,000,000 ÷ (4 × 433,920,000)).
#    Keep the two antennas separated and vertical. Placing RX and TX antennas
#    close together or parallel degrades both range and receive sensitivity.
#
#  ── Setup phases ─────────────────────────────────────────────────────────────
#
#  Phase 1 — Code discovery: uncomment "dump: rc_switch", flash the device,
#            press your doorbell button while watching the serial log, and
#            note the code and protocol values that repeat consistently.
#  Phase 2 — Deployment: fill in your captured code in the marked places below,
#            re-comment "dump:", and reflash.
#
# ════════════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────
#  Core device identity
#
#  "name" is the internal ESPHome identifier used for OTA and mDNS
#  (reachable at door-chime-rf.local on your network).
#  "friendly_name" is what appears in Home Assistant's device registry.
# ──────────────────────────────────────────
esphome:
  name: door-chime-rf
  friendly_name: Door Chime RF Bridge


# ──────────────────────────────────────────
#  Hardware target
#
#  Tells ESPHome which chip and framework to compile for.
#  ESP32-S3 has WiFi + Bluetooth; the Arduino framework is used here because
#  it has mature support for the remote_receiver/transmitter components.
#  (The original ESP32-H2 is Zigbee/Thread/BLE only — no WiFi.)
# ──────────────────────────────────────────
esp32:
  variant: esp32s3
  framework:
    type: arduino


# ──────────────────────────────────────────
#  Serial logging
#
#  The ESP32-S3's built-in USB-C port uses the USB Serial JTAG peripheral,
#  not a traditional UART. Without hardware_uart: USB_SERIAL_JTAG, log output
#  is sent to GPIO43/44 (UART0) and nothing appears over USB-C.
#
#  During Phase 1, DEBUG level causes every received RF packet to be printed
#  to the serial log — this is how you discover your doorbell's code.
#  Change to INFO once the code is confirmed to reduce noise.
# ──────────────────────────────────────────
logger:
  level: DEBUG  # Change to INFO after RF codes are confirmed
  hardware_uart: USB_SERIAL_JTAG


# ── WiFi & Home Assistant API ─────────────────────────────────────────────────
#
#  wifi: connects to your home network using credentials from secrets.yaml.
#
#  wifi.ap: if the primary WiFi connection fails (wrong password, router
#    rebooted, etc.), the device falls back to broadcasting its own access
#    point named "door-chime-rf". Connect to it to reach the captive portal.
#
#  captive_portal: when connected to the fallback AP, a web page lets you
#    update WiFi credentials without needing a USB cable or reflash.
#
#  api: the ESPHome native protocol that Home Assistant uses to communicate
#    with the device. The encryption key prevents network sniffing; HA
#    discovers the device automatically via mDNS once it is on the same network.
#
#  ota: allows reflashing the firmware over WiFi from the ESPHome dashboard
#    or CLI. After the first USB flash, all future updates can be wireless.
# ─────────────────────────────────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "door-chime-rf"
    password: !secret wifi_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password


# ──────────────────────────────────────────
#  433MHz Receiver  (SRX882 DATA pin → GPIO4)
#
#  remote_receiver monitors GPIO4 continuously in the background. When the
#  SRX882 demodulates an incoming RF burst it pulses DATA high/low; the
#  component times these pulses and tries to decode them using known protocols
#  (RC Switch, NEC, etc.).
#
#  tolerance: maximum timing deviation before a pulse is rejected. 60% is
#    generous — doorbell buttons use cheap crystal-less transmitters that
#    drift significantly from the protocol spec.
#
#  filter: discards any pulse shorter than 250µs. Brief spikes from electrical
#    noise or relay switching look like valid pulses to the receiver hardware;
#    this setting prevents them from triggering false decodes.
#
#  idle: if no pulse arrives within 4ms, the component treats the current
#    burst as complete and hands it to the decoder. 4ms is longer than the
#    inter-symbol gap in every common 433MHz protocol but shorter than the
#    gap between separate button transmissions.
#
#  dump: rc_switch (Phase 1 only):
#    When uncommented, every successfully decoded RC Switch packet is printed
#    to the serial log as:
#      Received RCSwitch Raw: protocol=1 data="010110100101101001011010" (24 bits)
#    Press the doorbell button several times and take the code that appears
#    consistently. Re-comment this line before the Phase 2 flash — leaving it
#    enabled fills the log with noise and can slow down the decoder.
# ──────────────────────────────────────────
remote_receiver:
  id: rf_rx
  pin:
    number: GPIO4
    mode:
      input: true
  # dump: rc_switch   # ← Uncomment for Phase 1 code discovery only
  tolerance: 60%
  filter: 250us
  idle: 4ms


# ──────────────────────────────────────────
#  433MHz Transmitter  (STX882 DATA pin ← GPIO5)
#
#  remote_transmitter drives GPIO5 with timed high/low pulses that encode the
#  specified protocol and data. The STX882 uses OOK (On-Off Keying): it
#  transmits the 433MHz carrier while DATA is high and goes silent when DATA
#  is low, so the pulse pattern on GPIO5 becomes the RF signal directly.
#
#  carrier_duty_percent: 100% means the GPIO is driven at full logic level
#  with no carrier frequency baked in. IR transmitters need a 38kHz carrier
#  wave modulated onto the data signal; 433MHz OOK modules do not — they
#  generate their own carrier internally.
# ──────────────────────────────────────────
remote_transmitter:
  id: rf_tx
  pin: GPIO5
  carrier_duty_percent: 100%  # RF modules use OOK — no software carrier needed


# ──────────────────────────────────────────
#  Doorbell binary sensor
#
#  This sensor subscribes to remote_receiver. Every decoded packet is compared
#  against the rc_switch_raw spec (code + protocol). On a match, the sensor
#  activates ("on") in Home Assistant, where it can trigger automations such
#  as push notifications, lights, or camera recordings.
#
#  rc_switch_raw matches the exact binary string and protocol number captured
#  during Phase 1. Using the raw code (rather than rc_switch_type_a/b/c)
#  avoids any ambiguity when doorbell codes do not map neatly onto a named
#  RC Switch address/command format.
#
#  device_class: occupancy — displays the sensor as a presence/occupancy
#  sensor in HA's UI. There is no dedicated "doorbell" device class; occupancy
#  produces a sensible icon and state label.
#
#  delayed_off: 3s — a single button press typically fires 3–10 identical RF
#  packets in quick succession (the transmitter keeps sending while the button
#  is held). delayed_off collapses all of them into one clean "on" event that
#  lasts 3 seconds, giving automations a stable, debounced trigger edge.
#
#  PHASE 2 — Replace the placeholder code and protocol with your captured values.
# ──────────────────────────────────────────
binary_sensor:
  - platform: remote_receiver
    id: doorbell_button
    name: "Doorbell"
    device_class: occupancy
    rc_switch_raw:
      code: "000000000000000000000000"  # ← REPLACE with your Phase 1 captured code
      protocol: 1                       # ← REPLACE with your Phase 1 protocol number
    filters:
      - delayed_off: 3s


# ──────────────────────────────────────────
#  Ring Chime button
#
#  A software button exposed in Home Assistant — no physical GPIO. Pressing it
#  in the HA UI or via an automation triggers on_press, which instructs the
#  STX882 to transmit the doorbell's RF code.
#
#  The code is sent three times with 10ms gaps between bursts. Physical doorbell
#  buttons transmit continuously while held, so chime receivers are designed to
#  act only after seeing several repetitions. A single burst can be missed if
#  the receiver's AGC (automatic gain control) is still settling; three bursts
#  reliably triggers every common 433MHz chime unit.
#
#  PHASE 2 — Replace the placeholder code and protocol with the same values
#  used in the binary_sensor section above. All three transmit actions must
#  carry the same code.
# ──────────────────────────────────────────
button:
  - platform: template
    name: "Ring Chime"
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_tx
          code: "000000000000000000000000"  # ← REPLACE with same code as binary_sensor
          protocol: 1                       # ← REPLACE with same protocol as binary_sensor
      - delay: 10ms
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_tx
          code: "000000000000000000000000"
          protocol: 1
      - delay: 10ms
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_tx
          code: "000000000000000000000000"
          protocol: 1
