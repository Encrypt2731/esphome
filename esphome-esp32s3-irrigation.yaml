# ──────────────────────────────────────────────────────────────────────────────
# ESPHome Irrigation Controller — ESP32-S3 (WiFi)
#
# Pinout:
#   GPIO2        — Relay signal → HL-52S relay module IN pin
#                  The HL-52S uses an active-LOW trigger: GPIO HIGH = relay off,
#                  GPIO LOW = relay energised. The pin is declared inverted so
#                  that ESPHome's logical ON maps to GPIO LOW (coil energised)
#                  and logical OFF maps to GPIO HIGH (coil de-energised, no
#                  current draw). Wire the load to the NO terminals on the relay.
#
#   button_start_pin — Start button: momentary push, wired between the GPIO and GND.
#                      Internal pull-up holds the pin HIGH at rest; pressing
#                      pulls it LOW. Configured inverted so "on" = pressed.
#   button_stop_pin  — Stop button: identical wiring to the start button.
#                      Change both substitutions to free GPIOs on your board.
#
# Connectivity:
#   Connects to Home Assistant over WiFi using ESPHome's native API.
#   Credentials live in secrets.yaml — see the WiFi section below.
#
# Session behaviour — three trigger sources, one duration variable:
#
#   HA scheduled  — HA's script.start_irrigation reads the Session Duration
#                   entity (number.irrigation_controller_session_duration) via
#                   the native API and manages the delay entirely on the HA side
#                   (turn on → wait → turn off). The ESP32 receives only the
#                   switch.turn_on / switch.turn_off commands.
#
#   Button        — Dedicated start and stop buttons. The start button begins
#                   an ad hoc cycle; pressing it while a session is already
#                   running is ignored. The stop button ends any active session
#                   regardless of what started it.
#
#   Fallback      — Activates automatically after heartbeat_timeout_h hours of
#                   HA disconnection. Runs two sessions per day using the same
#                   NVS-persisted session_duration_min value.
#
#   Hard cap      — Regardless of trigger source, max_duration_cap fires on the
#                   ESP32 after max_duration (10 min) and forces the relay off.
#                   This is the final backstop if HA's script delay fails to
#                   deliver the switch.turn_off command (e.g. WiFi interruption).
#
# Fallback watchdog:
#   Checks ESPHome API connectivity once per hour. If HA has been unreachable
#   for heartbeat_timeout_h consecutive hours the fallback schedule activates
#   automatically. No HA automation is required.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  # GPIO pins for the start and stop buttons (each wired between the GPIO and GND).
  # Change these to free GPIOs on your board.
  button_start_pin: "GPIO1"
  button_stop_pin: "GPIO3"

  # Absolute maximum duration for any single session, regardless of trigger
  # source. The ESP32 enforces this independently of HA.
  max_duration: "10min"

  # Hours of disconnection from HA before the fallback schedule activates
  heartbeat_timeout_h: "25"

  # Minimum hours between fallback sessions (24 hours / this value = sessions
  # per day; 12 = twice per day)
  fallback_interval_h: "12"

esphome:
  name: irrigation-controller
  friendly_name: Irrigation Controller

esp32:
  variant: esp32s3
  framework:
    type: arduino

# The ESP32-S3's built-in USB port uses the USB Serial JTAG peripheral.
# Without this setting logs go to GPIO43/44 (UART0) and nothing appears
# over USB-C.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ── WiFi & Home Assistant API ─────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret irrigation_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── Globals ───────────────────────────────────────────────────────────────────

globals:
  # Counts consecutive hours the ESPHome API has been unreachable. Reset to 0
  # whenever the API is connected. Not persisted to flash — resets on reboot,
  # giving HA time to reconnect before the fallback schedule activates.
  - id: hours_no_heartbeat
    type: int
    restore_value: no
    initial_value: '0'

  # Counts hours elapsed since irrigation last ran (either HA or fallback).
  # Prevents the fallback from running more frequently than fallback_interval_h.
  # Not persisted — resets on reboot, which is safe: the fallback will not
  # trigger for at least heartbeat_timeout_h hours after boot regardless.
  - id: hours_since_watered
    type: int
    restore_value: no
    initial_value: '0'

# ── Number ────────────────────────────────────────────────────────────────────

number:
  # Session duration — the single variable governing all three trigger paths.
  # Exposed to HA as: number.irrigation_controller_session_duration
  #
  # How each path uses it:
  #   HA scheduled  — HA's script.start_irrigation reads this entity via the API
  #                   and runs a script delay of this duration on the HA side.
  #   Button        — button_start_irrigation reads session_duration_min.state
  #                   directly on the ESP32; no API call required.
  #   Fallback      — fallback_irrigation reads session_duration_min.state
  #                   directly on the ESP32; works when HA is offline.
  #
  # restore_value: true persists the last value to NVS flash. The ESP32 reads
  # the correct duration across reboots and during HA outages without needing
  # HA to re-push the value. initial_value: 3 applies only on the very first
  # boot before HA has ever connected.
  - platform: template
    name: "Session Duration"
    id: session_duration_min
    icon: "mdi:clock-outline"
    unit_of_measurement: min
    min_value: 1
    max_value: 10
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 3

# ── Scripts ───────────────────────────────────────────────────────────────────

script:
  # Hard cap — armed by on_turn_on whenever the relay turns on, regardless of
  # trigger source. Fires after max_duration (10 min) and forces the relay off
  # if nothing else has done so already.
  #
  # For HA-scheduled sessions, HA's script delay is the intended off mechanism;
  # max_duration_cap is the backstop if that command fails to arrive (e.g. WiFi
  # interruption at the end of the session).
  #
  # For button/fallback sessions, the respective script turns the relay off
  # first; max_duration_cap is cancelled by on_turn_off before it fires.
  #
  # mode: restart resets the 10-minute timer if the relay is cycled off and
  # back on mid-session, ensuring the cap always reflects the current on-time.
  - id: max_duration_cap
    mode: restart
    then:
      - delay: $max_duration
      - switch.turn_off: irrigation_relay
      - logger.log: "Irrigation stopped by 10-min hard cap"

  # Fallback session — fires when HA has been unreachable for heartbeat_timeout_h
  # hours. Reads session_duration_min from NVS so the duration matches whatever
  # HA last configured, even across a prolonged outage.
  # mode: single prevents sessions stacking if the hourly watchdog fires while
  # a session is already in progress.
  - id: fallback_irrigation
    mode: single
    then:
      - logger.log: "Fallback irrigation started"
      - switch.turn_on: irrigation_relay
      - delay: !lambda |-
          return (uint32_t)(id(session_duration_min).state * 60.0f * 1000.0f);
      - switch.turn_off: irrigation_relay
      - logger.log: "Fallback irrigation complete"

  # Start button — begins an ad hoc session using session_duration_min from NVS.
  # Pressing start while a session is already running is silently ignored
  # (mode: single). max_duration_cap is armed by on_turn_on as a backstop.
  - id: button_start_irrigation
    mode: single
    max_exceeded: silent
    then:
      - if:
          condition:
            switch.is_on: irrigation_relay
          then:
            - logger.log: "Button: start ignored — relay already on"
          else:
            - logger.log: "Button: ad hoc irrigation started"
            - switch.turn_on: irrigation_relay
            - delay: !lambda |-
                return (uint32_t)(id(session_duration_min).state * 60.0f * 1000.0f);
            - switch.turn_off: irrigation_relay
            - logger.log: "Button: ad hoc irrigation complete"

# ── Switch ────────────────────────────────────────────────────────────────────

switch:
  # Irrigation relay — GPIO2 is declared inverted to match the HL-52S
  # active-LOW trigger: logical ON drives GPIO LOW (coil energised, water on),
  # logical OFF drives GPIO HIGH (coil de-energised, no current draw).
  #
  # ALWAYS_OFF unconditionally initialises the GPIO to its logical-OFF state
  # (physical HIGH) on every boot, regardless of any state stored in NVS flash.
  # This guarantees the valve cannot be energised by a power cut mid-session
  # followed by a reboot.
  #
  # on_turn_on fires for every trigger source (HA script, button, fallback) and
  # arms max_duration_cap. This means the hard cap is always active once the
  # relay is on, regardless of which system is managing the session.
  #
  # on_turn_off cancels max_duration_cap cleanly whether the relay was closed by
  # the HA script, the button script, the fallback script, or the hard cap itself.
  - platform: gpio
    pin:
      number: GPIO2
      inverted: true
    id: irrigation_relay
    name: "Irrigation"
    icon: "mdi:sprinkler"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - globals.set:
          id: hours_since_watered
          value: '0'
      - script.execute: max_duration_cap
    on_turn_off:
      - script.stop: max_duration_cap

# ── Buttons ───────────────────────────────────────────────────────────────────

binary_sensor:
  # Start button — wired between button_start_pin and GND.
  # Pressing starts an ad hoc irrigation cycle. Ignored if the relay is
  # already on (from any source).
  - platform: gpio
    pin:
      number: $button_start_pin
      mode:
        input: true
        pullup: true
      inverted: true
    id: irrigation_start_button
    name: "Irrigation Start"
    filters:
      - delayed_on: 50ms
    on_press:
      - script.execute: button_start_irrigation

  # Stop button — wired between button_stop_pin and GND.
  # Pressing stops the relay immediately regardless of what started the session.
  # Also cancels button_start_irrigation if its delay is still running, so
  # the script exits cleanly rather than attempting a redundant turn-off later.
  - platform: gpio
    pin:
      number: $button_stop_pin
      mode:
        input: true
        pullup: true
      inverted: true
    id: irrigation_stop_button
    name: "Irrigation Stop"
    filters:
      - delayed_on: 50ms
    on_press:
      - script.stop: button_start_irrigation
      - switch.turn_off: irrigation_relay
      - logger.log: "Button: irrigation stopped"

# ── Watchdog & fallback schedule ──────────────────────────────────────────────

interval:
  - interval: 1h
    then:
      - lambda: 'id(hours_since_watered) += 1;'
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(hours_no_heartbeat) = 0;'
          else:
            - lambda: 'id(hours_no_heartbeat) += 1;'
      - if:
          condition:
            lambda: |-
              return id(hours_no_heartbeat) >= $heartbeat_timeout_h
                  && id(hours_since_watered) >= $fallback_interval_h
                  && !id(irrigation_relay).state;
          then:
            - script.execute: fallback_irrigation
