# ──────────────────────────────────────────────────────────────────────────────
# ESPHome Fan Controller — Seeed XIAO ESP32-S3 (WiFi)
#
# Pinout (XIAO board labels):
#   D3 / GPIO4  — DS18B20 sensor 1 (1-Wire; fit 4.7kΩ pull-up to 3.3V externally)
#   D4 / GPIO5  — DS18B20 sensor 2 (1-Wire; fit 4.7kΩ pull-up to 3.3V externally)
#   D5 / GPIO6  — Fan 1 PWM signal (25 kHz; wire to PWM pin of 4-pin PC fan header)
#   D8 / GPIO7  — Fan 2 PWM signal (25 kHz; wire to PWM pin of 4-pin PC fan header)
#   D9 / GPIO8  — Relay signal     (wire to NC terminals — see relay safety note below)
#
# Connectivity:
#   Connects to Home Assistant over WiFi using ESPHome's native API.
#   Credentials live in secrets.yaml — see the WiFi section below.
#
# ── Relay safety design ────────────────────────────────────────────────────────
#
# REQUIREMENT: the circuit must open ONLY upon an explicit HA command. Any
# unintended opening (boot, power cut, firmware reset) is unacceptable.
#
# RELAY MODULE TYPE — active-low (optocoupler-based):
#   These modules energise the coil when the input signal is LOW, not HIGH.
#   The pin is therefore declared with inverted: true so that the ESPHome
#   switch's logical OFF state drives GPIO8 HIGH (coil de-energised) and the
#   logical ON state drives it LOW (coil energised).
#
# WIRING — use NC (normally closed) terminals on the relay module:
#   Relay coil de-energised (GPIO HIGH) → NC contacts CLOSED → circuit CONNECTED
#   Relay coil energised    (GPIO LOW)  → NC contacts OPEN   → circuit DISCONNECTED
#   This means the circuit is closed by default and only opens when actively
#   commanded. A power cut de-energises the coil and the circuit closes safely.
#
# BOOT SAFETY — no external pull resistor required:
#   While the ESP32-S3 is in reset (GPIO8 is high-impedance), the relay
#   module's own internal pull-up holds the signal HIGH, keeping the coil
#   de-energised throughout the entire boot sequence. Once firmware starts,
#   ALWAYS_OFF + inverted: true drives GPIO8 HIGH — the same safe state.
#   No external resistor is needed; do not fit a pull-down on GPIO8 as it
#   would fight the relay module's pull-up.
#
# SOFTWARE — ALWAYS_OFF restore mode:
#   ALWAYS_OFF guarantees the switch is OFF on every boot regardless of any
#   previously saved state. Combined with inverted: true and NC wiring this
#   means the circuit is always closed at startup. The only event that opens
#   the circuit is an explicit HA ON command via the ESPHome API.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  # Fan curve hardcoded defaults — used on first boot and restored when HA has
  # been unreachable for longer than heartbeat_timeout_h hours
  default_temp_low: "30.0"     # °C — fan ramping starts here
  default_temp_high: "60.0"    # °C — fans run at 100% above this
  default_fan_min_pct: "20.0"  # %  — minimum fan speed (keeps fans spinning)

  # Hours of silence from HA before the device considers it unreachable and
  # resets the curve parameters to the hardcoded defaults above
  heartbeat_timeout_h: "25"

  # Maximum time the relay is allowed to stay open (circuit disconnected).
  # The device closes the circuit automatically after this delay, even if HA
  # has not issued a close command.
  relay_max_disconnect: "30s"

esphome:
  name: fan-controller
  friendly_name: Fan Controller

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: arduino

# The XIAO ESP32-S3 has no USB-UART bridge chip. Serial output goes through the
# ESP32-S3's built-in USB Serial JTAG peripheral (the USB-C port). Without this
# setting, logs are sent to GPIO43/44 (UART0) and nothing appears over USB.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ── WiFi & Home Assistant API ─────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "fan-controller"
    password: !secret wifi_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── Hardware ──────────────────────────────────────────────────────────────────

# Each DS18B20 is on its own 1-Wire bus so sensors are addressed independently.
# Both require an external 4.7kΩ pull-up resistor to 3.3V.
one_wire:
  - platform: gpio
    pin: GPIO4
    id: ow_bus_1
  - platform: gpio
    pin: GPIO5
    id: ow_bus_2

# LEDC is the ESP32 hardware PWM peripheral. 25 kHz is the standard PWM
# frequency expected by 4-pin PC fan controllers.
output:
  - platform: ledc
    pin: GPIO6
    id: fan1_output
    frequency: 25000Hz

  - platform: ledc
    pin: GPIO7
    id: fan2_output
    frequency: 25000Hz

# ── Scripts ───────────────────────────────────────────────────────────────────

script:
  # Enforces the maximum relay disconnection time. Armed automatically when
  # the relay opens; cancelled when it closes. mode: restart means a second
  # open command within the window resets the timer rather than stacking it.
  - id: auto_reconnect
    mode: restart
    then:
      - delay: $relay_max_disconnect
      - switch.turn_off: relay
      - logger.log: "Relay closed by auto-reconnect timer"

# ── Adjustable curve parameters ───────────────────────────────────────────────
# HA writes to these via the ESPHome API. restore_value: true persists the last
# HA-set value to flash so custom settings survive a device reboot. When the
# heartbeat watchdog fires, these are reset to the substitution defaults.

number:
  - platform: template
    name: "Curve Temp Low"
    id: curve_temp_low
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 80
    step: 0.5
    initial_value: $default_temp_low
    optimistic: true
    restore_value: true

  - platform: template
    name: "Curve Temp High"
    id: curve_temp_high
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 100
    step: 0.5
    initial_value: $default_temp_high
    optimistic: true
    restore_value: true

  - platform: template
    name: "Fan Min Speed"
    id: curve_fan_min_pct
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: $default_fan_min_pct
    optimistic: true
    restore_value: true

# ── Switches ──────────────────────────────────────────────────────────────────

switch:
  # Relay — active-low module; inverted: true means switch OFF → GPIO HIGH →
  # coil de-energised. See the relay safety design note in the file header.
  - platform: gpio
    pin:
      number: GPIO8
      inverted: true
    id: relay
    name: "Relay"
    icon: "mdi:electric-switch"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: auto_reconnect   # arms the disconnection timer
    on_turn_off:
      - script.stop: auto_reconnect      # cancels the timer if closed early

  # Heartbeat — HA toggles this every hour. Any state change (on→off or off→on)
  # resets the hours_no_heartbeat counter. If no toggle is received within
  # heartbeat_timeout_h hours the device assumes HA is unreachable and resets
  # the fan curve to hardcoded safe defaults.
  - platform: template
    name: "HA Heartbeat"
    id: ha_heartbeat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - globals.set:
          id: hours_no_heartbeat
          value: '0'
    on_turn_off:
      - globals.set:
          id: hours_no_heartbeat
          value: '0'

# ── Globals ───────────────────────────────────────────────────────────────────

globals:
  # Counts hours elapsed since the last heartbeat from HA. Not persisted to
  # flash — resets to 0 on reboot, giving HA time to reconnect before the
  # fallback curve activates.
  - id: hours_no_heartbeat
    type: int
    restore_value: no
    initial_value: '0'

# ── Sensors & fan control ─────────────────────────────────────────────────────

sensor:
  # Sensor 1 controls Fan 1. On every reading the lambda recalculates fan speed
  # using the current curve parameters, then sets the LEDC PWM duty cycle.
  - platform: dallas_temp
    one_wire_id: ow_bus_1
    name: "Temperature 1"
    id: temp_1
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            float t      = x;
            float t_low  = id(curve_temp_low).state;
            float t_high = id(curve_temp_high).state;
            float f_min  = id(curve_fan_min_pct).state / 100.0f;
            float spd;

            if (isnan(t)) {
              // Sensor fault — run at full speed as a safe default
              spd = 1.00f;
            } else {
              // Smoothstep curve: normalise temperature to 0..1, then apply
              // 3t²-2t³, which has zero slope at both endpoints. This removes
              // the abrupt speed changes that a linear ramp produces at the
              // transition points (curve_temp_low and curve_temp_high).
              float norm = (t - t_low) / (t_high - t_low);
              norm = fmaxf(0.0f, fminf(1.0f, norm));   // clamp to 0..1
              float curve = norm * norm * (3.0f - 2.0f * norm);
              spd = f_min + curve * (1.0f - f_min);
            }

            id(fan1_output).set_level(spd);
            id(fan1_speed).publish_state(spd * 100.0f);

  # Sensor 2 controls Fan 2 using the same curve logic.
  - platform: dallas_temp
    one_wire_id: ow_bus_2
    name: "Temperature 2"
    id: temp_2
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            float t      = x;
            float t_low  = id(curve_temp_low).state;
            float t_high = id(curve_temp_high).state;
            float f_min  = id(curve_fan_min_pct).state / 100.0f;
            float spd;

            if (isnan(t)) {
              spd = 1.00f;
            } else {
              float norm = (t - t_low) / (t_high - t_low);
              norm = fmaxf(0.0f, fminf(1.0f, norm));
              float curve = norm * norm * (3.0f - 2.0f * norm);
              spd = f_min + curve * (1.0f - f_min);
            }

            id(fan2_output).set_level(spd);
            id(fan2_speed).publish_state(spd * 100.0f);

  # Read-only speed readbacks — exposed to HA for dashboards and automations
  - platform: template
    name: "Fan 1 Speed"
    id: fan1_speed
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:fan"

  - platform: template
    name: "Fan 2 Speed"
    id: fan2_speed
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:fan"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ── Heartbeat watchdog ────────────────────────────────────────────────────────

interval:
  - interval: 1h
    then:
      - lambda: |-
          id(hours_no_heartbeat) += 1;
      - if:
          condition:
            lambda: 'return id(hours_no_heartbeat) >= $heartbeat_timeout_h;'
          then:
            - number.set:
                id: curve_temp_low
                value: $default_temp_low
            - number.set:
                id: curve_temp_high
                value: $default_temp_high
            - number.set:
                id: curve_fan_min_pct
                value: $default_fan_min_pct
            - logger.log: "HA unreachable — curve reset to hardcoded defaults"

# ── Required HA automation ────────────────────────────────────────────────────
# Add the following automation to Home Assistant to keep the heartbeat watchdog
# fed. Without it, the device will revert to hardcoded defaults after 25 hours.
#
# automation:
#   - alias: "Fan controller heartbeat"
#     trigger:
#       - platform: time_pattern
#         hours: "/1"
#     action:
#       - service: switch.toggle
#         target:
#           entity_id: switch.fan_controller_ha_heartbeat
