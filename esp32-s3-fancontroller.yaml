# ──────────────────────────────────────────────────────────────────────────────
# ESPHome Fan Controller — Seeed XIAO ESP32-S3 (WiFi)
#
# Pinout (XIAO board labels):
#   D3 / GPIO4  — DS18B20 sensor 1 (1-Wire; fit 4.7kΩ pull-up to 3.3V externally)
#   D4 / GPIO5  — DS18B20 sensor 2 (1-Wire; fit 4.7kΩ pull-up to 3.3V externally)
#   D5 / GPIO6  — Fan 1 PWM signal (25 kHz; wire to PWM pin of 4-pin PC fan header)
#   D8 / GPIO7  — Fan 2 PWM signal (25 kHz; wire to PWM pin of 4-pin PC fan header)
#   D9 / GPIO8  — Relay signal     (wire to NC terminals — see relay safety note below)
#
# GPIO notes vs the classic ESP32 WiFi version:
#   The XIAO ESP32-S3 exposes only GPIO1–9, 43, 44. GPIO25/32/33 from the
#   classic ESP32 version are not available. GPIO43/44 are UART0 TX/RX and are
#   reserved for serial logging, so they are not used for control signals.
#   GPIO6, GPIO7, GPIO8 have no special strapping or SPI-flash functions on
#   the XIAO and are safe for PWM/relay use.
#
# Connectivity:
#   Connects to Home Assistant over WiFi using ESPHome's native API.
#   Credentials live in secrets.yaml — see the WiFi section below.
#
# ── Relay safety design ────────────────────────────────────────────────────────
#
# REQUIREMENT: the circuit must open ONLY upon an explicit HA command. Any
# unintended opening (boot, power cut, firmware reset) is unacceptable.
#
# WIRING — use NC (normally closed) terminals on the relay module:
#   Relay coil de-energized (GPIO LOW)  → NC contacts CLOSED → circuit CONNECTED
#   Relay coil energized    (GPIO HIGH) → NC contacts OPEN   → circuit DISCONNECTED
#
# HARDWARE PULL-DOWN — fit a 10kΩ resistor between GPIO8 (D9) and GND:
#   During the MCU reset and ROM boot phase all GPIO pins are in an undefined
#   floating state before firmware takes control. The external pull-down holds
#   GPIO8 firmly at LOW throughout the entire boot sequence.
#   Note: the ESP32-S3's internal pull-down is only active once firmware
#   configures it — an external resistor is required to cover that window.
#
# SOFTWARE — ALWAYS_OFF restore mode:
#   Once firmware is running, ALWAYS_OFF guarantees the GPIO is driven LOW on
#   every boot regardless of any previously saved state. Combined with NC wiring
#   this means the circuit is always closed at startup. The only event that
#   drives GPIO8 HIGH (opening the circuit) is an explicit HA ON command via
#   the ESPHome API. Boot, power restore, and the auto_reconnect timer all drive
#   the pin LOW (closing the circuit).
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  default_temp_low: "30.0"
  default_temp_high: "60.0"
  default_fan_min_pct: "20.0"
  heartbeat_timeout_h: "25"
  relay_max_disconnect: "30s"

esphome:
  name: fan-controller
  friendly_name: Fan Controller

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: arduino

# The XIAO ESP32-S3 has no USB-UART bridge chip. Serial output goes through the
# ESP32-S3's built-in USB Serial JTAG peripheral (the USB-C port). Without this
# setting, logs are sent to GPIO43/44 (UART0) and nothing appears over USB.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ── WiFi & Home Assistant API ─────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "fan-controller"
    password: !secret wifi_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── Hardware ──────────────────────────────────────────────────────────────────

one_wire:
  - platform: gpio
    pin: GPIO4
    id: ow_bus_1
  - platform: gpio
    pin: GPIO5
    id: ow_bus_2

output:
  - platform: ledc
    pin: GPIO6
    id: fan1_output
    frequency: 25000Hz

  - platform: ledc
    pin: GPIO7
    id: fan2_output
    frequency: 25000Hz

# ── Scripts ───────────────────────────────────────────────────────────────────

script:
  - id: auto_reconnect
    mode: restart
    then:
      - delay: $relay_max_disconnect
      - switch.turn_off: relay
      - logger.log: "Relay closed by auto-reconnect timer"

# ── Adjustable curve parameters ───────────────────────────────────────────────

number:
  - platform: template
    name: "Curve Temp Low"
    id: curve_temp_low
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 80
    step: 0.5
    initial_value: $default_temp_low
    optimistic: true
    restore_value: true

  - platform: template
    name: "Curve Temp High"
    id: curve_temp_high
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 100
    step: 0.5
    initial_value: $default_temp_high
    optimistic: true
    restore_value: true

  - platform: template
    name: "Fan Min Speed"
    id: curve_fan_min_pct
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: $default_fan_min_pct
    optimistic: true
    restore_value: true

# ── Switches ──────────────────────────────────────────────────────────────────

switch:
  - platform: gpio
    pin: GPIO8
    id: relay
    name: "Relay"
    icon: "mdi:electric-switch"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: auto_reconnect
    on_turn_off:
      - script.stop: auto_reconnect

  - platform: template
    name: "HA Heartbeat"
    id: ha_heartbeat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - globals.set:
          id: hours_no_heartbeat
          value: '0'
    on_turn_off:
      - globals.set:
          id: hours_no_heartbeat
          value: '0'

# ── Globals ───────────────────────────────────────────────────────────────────

globals:
  - id: hours_no_heartbeat
    type: int
    restore_value: no
    initial_value: '0'

# ── Sensors & fan control ─────────────────────────────────────────────────────

sensor:
  - platform: dallas_temp
    one_wire_id: ow_bus_1
    name: "Temperature 1"
    id: temp_1
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            float t      = x;
            float t_low  = id(curve_temp_low).state;
            float t_high = id(curve_temp_high).state;
            float f_min  = id(curve_fan_min_pct).state / 100.0f;
            float spd;

            if (isnan(t)) {
              // Sensor fault — run at full speed as a safe default
              spd = 1.00f;
            } else {
              // Smoothstep curve: normalise temperature to 0..1, then apply
              // 3t²-2t³, which has zero slope at both endpoints. This removes
              // the abrupt speed changes that a linear ramp produces at the
              // transition points (curve_temp_low and curve_temp_high).
              float norm = (t - t_low) / (t_high - t_low);
              norm = fmaxf(0.0f, fminf(1.0f, norm));   // clamp to 0..1
              float curve = norm * norm * (3.0f - 2.0f * norm);
              spd = f_min + curve * (1.0f - f_min);
            }

            id(fan1_output).set_level(spd);
            id(fan1_speed).publish_state(spd * 100.0f);

  - platform: dallas_temp
    one_wire_id: ow_bus_2
    name: "Temperature 2"
    id: temp_2
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            float t      = x;
            float t_low  = id(curve_temp_low).state;
            float t_high = id(curve_temp_high).state;
            float f_min  = id(curve_fan_min_pct).state / 100.0f;
            float spd;

            if (isnan(t)) {
              spd = 1.00f;
            } else {
              float norm = (t - t_low) / (t_high - t_low);
              norm = fmaxf(0.0f, fminf(1.0f, norm));
              float curve = norm * norm * (3.0f - 2.0f * norm);
              spd = f_min + curve * (1.0f - f_min);
            }

            id(fan2_output).set_level(spd);
            id(fan2_speed).publish_state(spd * 100.0f);

  - platform: template
    name: "Fan 1 Speed"
    id: fan1_speed
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:fan"

  - platform: template
    name: "Fan 2 Speed"
    id: fan2_speed
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:fan"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ── Heartbeat watchdog ────────────────────────────────────────────────────────

interval:
  - interval: 1h
    then:
      - lambda: |-
          id(hours_no_heartbeat) += 1;
      - if:
          condition:
            lambda: 'return id(hours_no_heartbeat) >= $heartbeat_timeout_h;'
          then:
            - number.set:
                id: curve_temp_low
                value: $default_temp_low
            - number.set:
                id: curve_temp_high
                value: $default_temp_high
            - number.set:
                id: curve_fan_min_pct
                value: $default_fan_min_pct
            - logger.log: "HA unreachable — curve reset to hardcoded defaults"

# ── Required HA automation ────────────────────────────────────────────────────
# Add the following automation to Home Assistant to keep the heartbeat watchdog
# fed. Without it, the device will revert to hardcoded defaults after 25 hours.
#
# automation:
#   - alias: "Fan controller heartbeat"
#     trigger:
#       - platform: time_pattern
#         hours: "/1"
#     action:
#       - service: switch.toggle
#         target:
#           entity_id: switch.fan_controller_ha_heartbeat
